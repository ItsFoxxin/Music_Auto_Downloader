[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "foxden-music"
version = "2.3.1"
description = "A security-focused, self-hosted music importer and Jellyfin library manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.3",
  "sqlalchemy==2.0.52",
  "pydantic-settings==2.15.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "mutagen==1.48.1",
  "Pillow==12.3.0",
  "itsdangerous==2.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[project.scripts]
foxden-music-web = "foxden_music.web:run"
foxden-music-worker = "foxden_music.worker:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
foxden_music = ["templates/**/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: requires external programs such as ffmpeg/ffprobe",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
