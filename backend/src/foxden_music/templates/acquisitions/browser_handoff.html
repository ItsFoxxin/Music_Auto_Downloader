<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="refresh" content="0;url={{ browser_url }}">
  <title>Opening server browser · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}?v={{ version }}">
</head>
<body>
  <main class="page-shell" id="main-content">
    <section class="panel form-stack">
      <p class="eyebrow">Watched download started</p>
      <h1>Opening the server browser…</h1>
      <p>Fox Den is now watching the download folder for this request.</p>
      <p><a class="button primary" href="{{ browser_url }}">Continue to server browser</a></p>
      <p class="muted fine-print">If the browser does not open automatically, use the button above.</p>
      <p><a href="/acquisitions/{{ acquisition.id }}">Return to the acquisition</a></p>
    </section>
  </main>
</body>
</html>
