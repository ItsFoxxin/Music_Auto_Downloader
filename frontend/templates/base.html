<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Fox Den Music dashboard">
      <span class="brand-mark" aria-hidden="true">FD</span>
      <span><strong>Fox Den</strong> Music</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="/"{% if request.url.path == '/' %} aria-current="page"{% endif %}>Dashboard</a>
      <a href="/add"{% if request.url.path in ['/add', '/imports'] %} aria-current="page"{% endif %}>Add music</a>
      <a href="/acquisitions"{% if request.url.path.startswith('/acquisitions') %} aria-current="page"{% endif %}>Queue</a>
      <a href="/review"{% if request.url.path == '/review' %} aria-current="page"{% endif %}>Review</a>
      <a href="/library"{% if request.url.path.startswith('/library') %} aria-current="page"{% endif %}>Library</a>
      <a href="/history"{% if request.url.path == '/history' %} aria-current="page"{% endif %}>History</a>
    </nav>
  </header>
  <main class="page-shell" id="main-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer>Fox Den Music {{ version }} · self-hosted library manager</footer>
</body>
</html>
