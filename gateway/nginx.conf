worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    # Docker's resolver allows either backend to restart without a gateway restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        # The application enforces its configured upload limit while streaming.
        client_max_body_size 0;
        client_body_timeout 3600s;
        location = /server-browser { return 302 /server-browser/; }
        location /server-browser/ {
            set $browser_backend download-browser:5800;
            rewrite ^/server-browser/(.*)$ /$1 break;
            proxy_pass http://$browser_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
        location / {
            set $app_backend web:8000;
            proxy_pass http://$app_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
